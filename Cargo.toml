[package]
name = "way-small"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0.100"
serde = { version = "1.0.219", features = ["derive"] }
tracing = { version = "0.1.41" }
tracing-subscriber = "0.3"
toml = "1.1.2"
tokio = { version = "1.48", features = ["full"] }
tokio-util = "0.7.18"
libc = "0.2.186"
async-stream = "0.3.6"
winit = "0.30.13"
xkbcommon = "0.9.0"
dirs = "6.0.0"
sendfd = { version = "0.4.4", features = ["tokio"] }
xcursor = "0.3.10"
strum = { version ="0.28.0", features = ["derive"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland"] }
glow = "0.16"
raw-window-handle = "0.6"
enumflags2 = "0.7.12"
