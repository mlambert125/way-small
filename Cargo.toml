[package]
name = "way-small"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0.100"
serde = { version = "1.0.219", features = ["derive"] }
tracing = { version = "0.1.41" }
tracing-subscriber = "0.3"
tokio = { version = "1.48", features = ["full"] }
sendfd = { version = "0.4.4", features = ["tokio"] }
async-stream = "0.3.6"
tokio-util = "0.7.18"
winit = "0.30.13"
softbuffer = "0.4.8"
xkbcommon = "0.9.0"
toml = "1.1.2"
dirs = "6.0.0"
